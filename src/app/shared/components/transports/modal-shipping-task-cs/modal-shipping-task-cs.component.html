<div ngDraggable [handle]="myHandle" class="modal fade" bsModal #modalAddEdit="bs-modal" [config]="{backdrop: 'static'}"
  tabindex="-1" role="dialog" aria-labelledby="dialog-static-name" (onHidden)="OnHidden()">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" [class.draft-view]="_isDraftView">
      <div #myHandle class="modal-header">
        <h4 class="modal-title pull-left">Công việc Giao nhận vận chuyển
          <span *ngIf="_isDraftView" class="label" style="background:#FFC107;color:#333;">NHÁP #{{ _draftId }}</span>
        </h4>
        <button type="button" class="close pull-right" aria-label="Close" (click)="modalAddEdit.hide()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form class="form-horizontal" novalidate #addEditForm="ngForm" (ngSubmit)="saveChange(addEditForm)"
          *ngIf="entity">
          <div class="box-body">
            <div class="form-group">
              <label class="col-sm-2 control-label">Khách hàng
                <span class="error">*</span>
              </label>
              <div class="col-sm-2">
                <input class="form-control" type="text" name="makh" [(ngModel)]="customerCode" required
                  [readonly]="flagXem" (keydown.enter)="searchCustomer()">
              </div>
              <div class="col-sm-6">
                <ng-select [items]="listCustomer" name="customercode" required bindLabel="customerName" bindValue="id"
                  [disabled]="flagXem" (change)="changedCustomer($event)" [(ngModel)]="entity.customerId">
                </ng-select>
              </div>
              <div class="col-sm-2" style="justify-content: flex-end; display: flex;">
                <button *ngIf="entity.id!=undefined" type="button" class="btn btn-primary btn-sm" (click)="attack()">
                  <i class="fa fa-file"></i> Đính kèm</button>
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label">JobId
                <span class="error">*</span>
              </label>
              <div class="col-sm-4">
                <div class="input-group">
                  <span class="form-control" style="color: red;"><b>{{entity.jobId}}</b></span>
                  <span class="input-group-btn">
                    <button *ngIf=" entity.status<1" type="button" class="btn btn-primary btn-sm " (click)="getJobId()">
                      <i class="fa fa-edit"></i>...</button>
                  </span>
                </div>
              </div>
              <label class="col-sm-2 control-label"> Loại hình</label>
              <div class="col-sm-4">
                <ng-select name="shipmentType" [items]="listShipmentType" bindLabel="categoryName" bindValue="id"
                  [(ngModel)]="entity.shipmentType" placeholder="Loại hình" disabled>
                </ng-select>
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label">Nhóm thực hiện công việc
                <span class="error">*</span>
              </label>
              <div class="col-sm-4">
                <ng-select [items]="listHandlingGroup" name="hadlinggroupid" required bindLabel="handlingGroupName"
                  bindValue="id" [disabled]="flagXem " [(ngModel)]="entity.handlingGroupId">
                </ng-select>
              </div>
              <!-- Loại vận chuyển: bắt buộc; Job có loại thì lấy theo Job + khóa -->
              <label class="col-sm-2 control-label">Loại vận chuyển
                <span class="error">*</span>
              </label>
              <div class="col-sm-4">
                <ng-select [items]="listTaskType" name="taskType" required bindLabel="text" bindValue="id"
                  [disabled]="flagXem || lockTaskType" [(ngModel)]="entity.taskType" [clearable]="false"
                  placeholder="FCL / LCL / CBT" [title]="lockTaskType ? 'Lấy theo Loại vận chuyển của Job' : ''">
                </ng-select>
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label">Nơi nhận hàng<span class="error">*</span></label>
              <div class="col-sm-10">
                <ng-select name="pickupLocationKey" [items]="locationItems" bindLabel="name" bindValue="key"
                  groupBy="group" [(ngModel)]="pickupKey" (change)="changePickupLocation($event)" required>
                </ng-select>
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label">Nơi giao hàng<span class="error">*</span></label>
              <div class="col-sm-10">
                <ng-select name="deliveryLocationKey" [items]="locationItems" bindLabel="name" bindValue="key"
                  groupBy="group" [(ngModel)]="deliveryKey" (change)="changeDeliveryLocation($event)" required>
                </ng-select>
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label">T/g KH yêu cầu
                <span class="error" *ngIf="!isCBT">*</span>
              </label>
              <div class="col-sm-4">
                <input name="pickupTime" type="text" daterangepicker [options]="ngaybatdauOption"
                  [(ngModel)]="entity.pickupTime" class="form-control" (selected)="selectedpickupTime($event)"
                  (hideDaterangepicker)="closedpickupTime($event)" autocomplete="off" [disabled]="flagXem">
              </div>
              <label class="col-sm-2 control-label" *ngIf="isFCL && !isEport"> T/g trả cont rỗng <span
                  class="error">*</span></label>
              <div class="col-sm-4" *ngIf="isFCL && !isEport">
                <input name="detentionTime" type="text" daterangepicker [options]="ngaybatdauOption"
                  [required]="isFCL && !isEport" [(ngModel)]="entity.detentionTime" class="form-control"
                  (selected)="selecteddetentionTime($event)" (hideDaterangepicker)="closeddetentionTime($event)"
                  autocomplete="off" [disabled]="flagXem">
              </div>
              <label class="col-sm-2 control-label" *ngIf="showCutOff">T/g Cut-off <span class="error" *ngIf="isFCL">*</span></label>
              <div class="col-sm-4" *ngIf="showCutOff">
                <input name="cutOffTime" type="text" daterangepicker [options]="ngayhoanthanhOption"
                  [required]="isFCL && isEport" [(ngModel)]="entity.cutOffTime" class="form-control"
                  (selected)="selectedcutOffTime($event)" (hideDaterangepicker)="closedcutOffTime($event)"
                  autocomplete="off" [disabled]="flagXem">
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label" *ngIf="!isCBT">{{ isLCL ? 'T/g lấy hàng tại Cảng/Sân bay' : 'T/g pick-up cont tại Cảng' }} <span class="error">*</span></label>
              <div class="col-sm-4" *ngIf="!isCBT">
                <input name="demurageTime" type="text" daterangepicker [options]="ngayhoanthanhOption"
                  [(ngModel)]="entity.demurageTime" class="form-control"
                  (selected)="selectedcontainerStoragePeriod($event)"
                  (hideDaterangepicker)="closedcontainerStoragePeriod($event)" autocomplete="off" [disabled]="flagXem">
              </div>

              <label class="col-sm-2 control-label" [class.col-sm-offset-6]="isCBT">Mã tham chiếu <span class="error">*</span> </label>
              <div class="col-sm-4">
                <input name="referCode" type="text" [(ngModel)]="entity.referCode" class="form-control" required
                  [disabled]="flagXem">
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label" *ngIf="isFCL">Booking</label>
              <div class="col-sm-4" *ngIf="isFCL">
                <input name="billBooking" type="text" [(ngModel)]="entity.billBooking" class="form-control"
                  [disabled]="flagXem">
              </div>
              <label class="col-sm-2 control-label" [class.col-sm-offset-6]="!isFCL"> Lượng hàng
              </label>
              <div class="col-sm-4 text-right">
                <input class="form-control so-luong" [(ngModel)]="entity.weight" name="weight" [readonly]="flagXem"
                  [mask]="maskNumber" />
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label" *ngIf="!isCBT">Ops làm lệnh</label>
              <div class="col-sm-4" *ngIf="!isCBT">
                <ng-select name="nhanvien" [items]="listEmployee" bindLabel="employeeFullName" bindValue="id"
                  [(ngModel)]="entity.operatorId">
                </ng-select>
              </div>
              <label class="col-sm-2 control-label" [class.col-sm-offset-6]="isCBT">Size kiện hàng</label>
              <div class="col-sm-4">
                <input class="form-control" [(ngModel)]="entity.dimension" type="text" name="dimension" />
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label" *ngIf="!isLCL">Số Cont</label>
              <div class="col-sm-4" *ngIf="!isLCL">
                <div class="input-group" style="width: 100%;">
                  <input name="containerNumberAccordingToPlan" type="text" [(ngModel)]="entity.containerNumber"
                    class="form-control" [disabled]="flagXem" />
                  <span class="input-group-btn">
                    <button type="button" class="btn btn-primary btn-sm " (click)="viewShipmentContSeal()"
                      [disabled]="entity.status>1">
                      <i class="fa fa-search"></i></button>
                  </span>
                </div>
              </div>
              <label class="col-sm-2 control-label" [class.col-sm-offset-6]="isLCL">Số chì</label>
              <div class="col-sm-4">
                <input name="sealNumberAccordingToPlan" type="text" [(ngModel)]="entity.sealNumber" class="form-control"
                  [disabled]="flagXem" />
              </div>
            </div>
            <div class="form-group" *ngIf="!isLCL">
              <label class="col-sm-2 control-label">Loại
                Container</label>
              <div class="col-sm-2">
                <ng-select [items]="listContTypes" name="listContTypes" bindLabel="categoryName"
                  bindValue="categoryCode" [disabled]="flagXem" [(ngModel)]="entity.contType">
                </ng-select>
              </div>
              <label class="col-sm-2 control-label" *ngIf="isFCL">Loại lệnh nâng</label>
              <div class="col-sm-2" *ngIf="isFCL">
                <ng-select [items]="listTypeOfLiffingOrder" name="typeOfLiffingOrder" bindLabel="value" bindValue="id"
                  [disabled]="flagXem" [(ngModel)]="entity.typeOfLiffingOrder">
                </ng-select>
              </div>
              <label class="col-sm-2 control-label" *ngIf="isFCL">Loại lệnh hạ</label>
              <div class="col-sm-2" *ngIf="isFCL">
                <ng-select [items]="listTypeOfLiffingOrder" name="typeOfLiftOffOrder" bindLabel="value" bindValue="id"
                  [disabled]="flagXem" [(ngModel)]="entity.typeOfLiftOffOrder">
                </ng-select>
              </div>
            </div>
            <div class="form-group" *ngIf="!isCBT">
              <label class="col-sm-2 control-label" *ngIf="isFCL">Hãng tàu</label>
              <div class="col-sm-4" *ngIf="isFCL">
                <ng-select [items]="listShipBrand" name="shipBrand" bindLabel="categoryName" bindValue="id"
                  [disabled]="flagXem" [(ngModel)]="entity.shipBrand">
                </ng-select>
              </div>
              <label class="col-sm-2 control-label" [class.col-sm-offset-6]="!isFCL">Kho CFS</label>
              <div class="col-sm-4">
                <ng-select [items]="listPorts" name="cFSWarehouse" bindLabel="name" bindValue="id" [disabled]="flagXem"
                  [(ngModel)]="entity.cfsWarehouse">
                </ng-select>
              </div>
            </div>
            <div class="form-group" *ngIf="isFCL">
              <label class="col-sm-2 control-label">Cảng/bãi nâng</label>
              <div class="col-sm-4">
                <ng-select [items]="listPorts" name="portOfLiffting" bindLabel="name" bindValue="id"
                  [disabled]="flagXem" [(ngModel)]="entity.portOfLiffting">
                </ng-select>
              </div>
              <label class="col-sm-2 control-label">Cảng/bãi hạ</label>
              <div class="col-sm-4">
                <ng-select [items]="listPorts" name="portOfLiffoff" bindLabel="name" bindValue="id" [disabled]="flagXem"
                  [(ngModel)]="entity.portOfLiftOff">
                </ng-select>
              </div>
            </div>

            <div class="form-group">
              <label class="col-sm-2 control-label">Người giao hàng/SĐT</label>
              <div class="col-sm-4">
                <input class="form-control" [(ngModel)]="entity.deliveryInformaiton" type="text"
                  name="deliveryReturnLocation" />
              </div>
              <label class="col-sm-2 control-label">Người nhận hàng/SĐT</label>
              <div class="col-sm-4">
                <input class="form-control" [(ngModel)]="entity.receiverInformation" type="text"
                  name="receiverInformation" />
              </div>
            </div>
            <div class="form-group" *ngIf="isFCL">
              <label class="col-sm-2 control-label">T/t xuất HĐ nâng hạ Cont</label>
              <div class="col-sm-10">
                <input class="form-control" [(ngModel)]="entity.informationOnContainerLiffInvoice" type="text"
                  name="informationOnContainerLiffInvoice" />
              </div>
            </div>
            <div class="form-group" *ngIf="isFCL">
              <label class="col-sm-2 control-label">T/t xuất HĐ ngoài</label>
              <div class="col-sm-10">
                <input class="form-control" [(ngModel)]="entity.externalInformationOnContainerLiffInvoice" type="text"
                  name="externalInformationOnContainerLiffInvoice" />
              </div>
            </div>
            <div class="form-group" *ngIf="isFCL">
              <label class="col-sm-2 control-label">T/t xuất HĐ phụ phí khác</label>
              <div class="col-sm-10">
                <input class="form-control" [(ngModel)]="entity.informationOfSurchargeInvoice" type="text"
                  name="informationOfSurchargeInvoice" />
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-2 control-label">Ghi chú</label>
              <div class="col-sm-10">
                <textarea class="form-control" [(ngModel)]="entity.note" rows="1" name="note"></textarea>
              </div>
            </div>
            <div class="form-group" *ngIf="entity.status<1">
              <div class="col-sm-2"></div>
              <div class="col-sm-10">
                <label class="custom-checkbox" style="color: blue;">
                  <input type="checkbox" [(ngModel)]="checked" name="status" [disabled]="flagXem" />
                  <span class="helping-el"></span>
                  Chuyển việc cho Điều vận
                </label>
              </div>
            </div>
          </div>
          <!-- /.box-body -->
          <div class="box-footer text-right">
            <button *ngIf="!flagXem && !_isDraftView" type="button" class="btn btn-primary btn-sm" (click)="saveAndNew(addEditForm)"
              [disabled]="!addEditForm.form.valid || flagSave ">
              <i class="fa fa-save"></i> Lưu & Nhập tiếp</button>
            <button *ngIf="!flagXem && !_isDraftView" type="submit" class="btn btn-primary btn-sm"
              [disabled]="!addEditForm.form.valid || flagSave">
              <i class="fa fa-save"></i> Lưu</button>
            <button *ngIf="_isDraftView" type="button" class="btn btn-success btn-sm" (click)="approveDraft()"
              [disabled]="!addEditForm.form.valid || flagSave">
              <i class="fa fa-check"></i> Xác nhận chuyển sang ERP</button>
            <button type="button" (click)="modalAddEdit.hide()" class="btn btn-danger btn-sm">
              <i class="fa fa-close"></i> Hủy</button>
          </div>
          <!-- /.box-footer -->
        </form>
      </div>
    </div>
  </div>
</div>
<modal-attachfile *ngIf="viewAttackFiles" (CloseModal)="closeAttackModal()">
</modal-attachfile>
<modal-shipment-view-search *ngIf="viewSearchJobId" (SaveSuccess)="saveSuccessJobId($event)">
</modal-shipment-view-search>
<modal-list-cont-seal *ngIf="viewContSeals" (SaveSuccess)="saveSuccessContSeal($event)"
  (CloseModal)="closeShipmentContSealsModal()">
</modal-list-cont-seal>
