<div ngDraggable [handle]="myHandle" class="modal fade" bsModal #modalFclHistory="bs-modal"
  [config]="{backdrop: 'static'}" tabindex="-1" role="dialog" aria-labelledby="dialog-static-name"
  (onHidden)="OnHidden()">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" [ngBusy]="busy">
      <div #myHandle class="modal-header">
        <h4 class="modal-title pull-left">Lịch sử lệnh FCL
          <a style="font-size: 14px;">{{refNo}}</a>
        </h4>
        <button type="button" class="close pull-right" aria-label="Close" (click)="modalFclHistory.hide()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="box-body table-responsive no-padding">
          <table class="table table-bordered table-condensed">
            <thead>
              <tr>
                <th style="width: 160px;">Thời gian</th>
                <th style="width: 150px;">Bước</th>
                <th style="width: 180px;">Người thực hiện</th>
                <th>Nội dung / Lý do</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of listHistory">
                <td>{{item.createdDate | date:'dd/MM/yyyy HH:mm:ss'}}</td>
                <td>{{item.step}}</td>
                <td>{{item.employeeFullName}}</td>
                <td>{{item.notes}}</td>
              </tr>
              <tr *ngIf="!listHistory || listHistory.length === 0">
                <td colspan="4" class="text-center">Chưa có lịch sử</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer text-right">
        <button type="button" class="btn btn-danger btn-sm" (click)="modalFclHistory.hide()">
          <i class="fa fa-close"></i> Đóng</button>
      </div>
    </div>
  </div>
</div>
