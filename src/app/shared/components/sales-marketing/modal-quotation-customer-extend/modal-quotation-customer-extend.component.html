<div ngDraggable [handle]="myHandle" class="modal fade" bsModal #modalExtend="bs-modal" [config]="{backdrop: 'static'}"
  tabindex="-1" role="dialog" aria-labelledby="dialog-static-name" (onHidden)="OnHidden()">
  <div class="modal-dialog modal-md">
    <div class="modal-content">
      <div #myHandle class="modal-header" style="cursor: move;">
        <h4 class="modal-title pull-left">GIA HẠN BÁO GIÁ</h4>
        <button type="button" class="close pull-right" aria-label="Close" (click)="modalExtend.hide()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form class="form-horizontal" novalidate *ngIf="item">
          <div class="box-body">
            <div class="form-group">
              <label class="col-sm-4 control-label">Số báo giá</label>
              <div class="col-sm-8">
                <input type="text" class="form-control" [value]="item.quotationNo || ''" readonly>
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-4 control-label">Hạn hiện tại</label>
              <div class="col-sm-8">
                <input type="text" class="form-control" [value]="currentFDate" readonly>
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-4 control-label">Ngày đến hạn mới <span class="error">*</span></label>
              <div class="col-sm-8 date">
                <input name="denngay" type="text" daterangepicker [options]="dateTimeOptions"
                  [(ngModel)]="_denNgay" class="form-control" (selected)="selectedDenNgay($event)"
                  (hideDaterangepicker)="closedDenNgay($event)" autocomplete="off" required>
              </div>
            </div>
            <div class="form-group">
              <label class="col-sm-4 control-label">Lý do gia hạn <span class="error">*</span></label>
              <div class="col-sm-8">
                <textarea name="reason" class="form-control" rows="3" maxlength="1000" [(ngModel)]="reason"
                  placeholder="Nhập lý do gia hạn" required></textarea>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer text-right">
        <button type="button" class="btn btn-success btn-sm" (click)="save()" [disabled]="flagSave || !reason?.trim() || !_denNgay">
          <i class="fa fa-check"></i> Gia hạn</button>
        <button type="button" class="btn btn-danger btn-sm" (click)="modalExtend.hide()">
          <i class="fa fa-close"></i> Hủy</button>
      </div>
    </div>
  </div>
</div>
